name: C++ CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            build_type: Debug
            ccache: true
          - os: ubuntu-22.04
            build_type: Release
            ccache: true
          - os: macos-14
            build_type: Release
            ccache: true
          - os: windows-2022
            build_type: Release
            ccache: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup ccache (Linux/macOS)
        if: runner.os != 'Windows' && matrix.ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cpp', '**/*.hpp') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.build_type }}-

      - name: Configure ccache
        if: runner.os != 'Windows' && matrix.ccache
        run: |
          ccache --set-config=max_size=500M
          ccache --set-config=compression=true
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV

      - name: Configure with CMake Preset
        run: cmake --preset ${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}

      - name: Build
        run: cmake --build build/${{ matrix.build_type == 'Debug' && 'debug' || 'release' }} --parallel 4

      - name: Run Tests
        run: ctest --test-dir build/${{ matrix.build_type == 'Debug' && 'debug' || 'release' }} --output-on-failure --parallel 4

      - name: Upload Test Artifacts (Debug)
        if: matrix.build_type == 'Debug' && always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-debug
          path: build/debug/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  sanitize:
    name: Sanitizers (Address/Undefined)
    runs-on: ubuntu-22.04
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-sanitize-${{ hashFiles('**/CMakeLists.txt', '**/*.cpp', '**/*.hpp') }}

      - name: Configure with sanitizers
        run: |
          cmake -S . -B build/sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCONSISTENT_HASH_ENABLE_SANITIZERS=ON \
            -DCONSISTENT_HASH_BUILD_TESTS=ON \
            -DCONSISTENT_HASH_BUILD_BENCHMARKS=OFF \
            -DCONSISTENT_HASH_BUILD_EXAMPLES=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build with sanitizers
        run: cmake --build build/sanitize --parallel 4

      - name: Run tests with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/sanitize --output-on-failure --parallel 4

  clang-tidy:
    name: Static Analysis (clang-tidy)
    runs-on: ubuntu-22.04
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-18

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure with compile commands
        run: |
          cmake -S . -B build/clang-tidy \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCONSISTENT_HASH_BUILD_TESTS=ON \
            -DCONSISTENT_HASH_BUILD_BENCHMARKS=OFF \
            -DCONSISTENT_HASH_BUILD_EXAMPLES=ON

      - name: Run clang-tidy
        run: |
          cd build/clang-tidy
          run-clang-tidy-18.py -p . -header-filter=.*/include/.* -quiet 2>&1 | head -200

  docker-build:
    name: Docker Multi-stage Build
    runs-on: ubuntu-22.04
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: consistent-hash:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm consistent-hash:${{ github.sha }} \
            ./bin/example_load_balancer
          docker run --rm consistent-hash:${{ github.sha }} \
            ./bin/example_cache_sharding
          docker run --rm consistent-hash:${{ github.sha }} \
            ./bin/example_db_sharding
          docker run --rm consistent-hash:${{ github.sha }} \
            ./bin/example_cdn_routing

  release:
    name: Create Release
    runs-on: ubuntu-22.04
    needs: [build-and-test, sanitize, clang-tidy, docker-build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure release build
        run: cmake --preset release

      - name: Build release
        run: cmake --build build/release --parallel 4

      - name: Run tests
        run: ctest --test-dir build/release --output-on-failure

      - name: Package artifacts
        run: |
          cd build/release
          cpack -G TGZ
          cpack -G ZIP

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/release/*.tar.gz
            build/release/*.zip
          generate_release_notes: true