name: C++ CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Weekly fuzzing run
    - cron: '0 2 * * 0'
    # Weekly chaos testing
    - cron: '0 3 * * 1'
    # Weekly mutation testing
    - cron: '0 4 * * 2'

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-22.04
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [cpp]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure with CMake
        run: cmake -S . -B build/codeql -DCMAKE_BUILD_TYPE=Debug -DCONSISTENT_HASH_BUILD_TESTS=ON -DCONSISTENT_HASH_BUILD_BENCHMARKS=OFF -DCONSISTENT_HASH_BUILD_EXAMPLES=OFF

      - name: Build for CodeQL
        run: cmake --build build/codeql --parallel 4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  build-and-test:
    name: Build and Test (${{ matrix.os }}, ${{ matrix.build_type }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            build_type: Debug
            ccache: true
            compiler: gcc
          - os: ubuntu-22.04
            build_type: Release
            ccache: true
            compiler: gcc
          - os: ubuntu-22.04
            build_type: Release
            ccache: true
            compiler: clang
          - os: ubuntu-24.04
            build_type: Release
            ccache: true
            compiler: gcc
          - os: macos-14
            build_type: Release
            ccache: true
            compiler: clang
          - os: macos-15
            build_type: Release
            ccache: true
            compiler: clang
          - os: windows-2022
            build_type: Release
            ccache: false
            compiler: msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure compiler (Linux)
        if: runner.os == 'Linux' && matrix.compiler == 'clang'
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      - name: Configure compiler (Linux GCC)
        if: runner.os == 'Linux' && matrix.compiler == 'gcc'
        run: |
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV

      - name: Setup ccache (Linux/macOS)
        if: runner.os != 'Windows' && matrix.ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.build_type }}-${{ matrix.compiler }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cpp', '**/*.hpp') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.build_type }}-${{ matrix.compiler }}-

      - name: Configure ccache
        if: runner.os != 'Windows' && matrix.ccache
        run: |
          ccache --set-config=max_size=500M
          ccache --set-config=compression=true
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV

      - name: Configure with CMake Preset
        run: cmake --preset ${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}

      - name: Build
        run: cmake --build build/${{ matrix.build_type == 'Debug' && 'debug' || 'release' }} --parallel 4

      - name: Run Tests
        run: ctest --test-dir build/${{ matrix.build_type == 'Debug' && 'debug' || 'release' }} --output-on-failure --parallel 4

      - name: Run Property Tests
        if: matrix.build_type == 'Release' && runner.os == 'Linux'
        run: ctest --test-dir build/release --output-on-failure --parallel 4 -R Property

      - name: Run Chaos Tests
        if: matrix.build_type == 'Release' && runner.os == 'Linux' && github.event_name == 'schedule'
        run: |
          ctest --test-dir build/release --output-on-failure --parallel 1 -R Chaos || true

      - name: Upload Test Artifacts (Debug)
        if: matrix.build_type == 'Debug' && always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.compiler }}-debug
          path: build/debug/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  coverage:
    name: Code Coverage
    runs-on: ubuntu-22.04
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Install lcov and gcovr
        run: sudo apt-get update && sudo apt-get install -y lcov gcovr

      - name: Configure with coverage
        run: |
          cmake -S . -B build/coverage \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCONSISTENT_HASH_ENABLE_COVERAGE=ON \
            -DCONSISTENT_HASH_BUILD_TESTS=ON \
            -DCONSISTENT_HASH_BUILD_BENCHMARKS=OFF \
            -DCONSISTENT_HASH_BUILD_EXAMPLES=OFF

      - name: Build with coverage
        run: cmake --build build/coverage --parallel 4

      - name: Run tests with coverage
        run: ctest --test-dir build/coverage --output-on-failure --parallel 4

      - name: Generate coverage report
        run: |
          cd build/coverage
          lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch
          lcov --remove coverage.info '/usr/*' '*/_deps/*' '*/tests/*' '*/examples/*' '*/benchmarks/*' '*/fuzz/*' --output-file coverage.filtered.info
          lcov --list coverage.filtered.info
          gcovr -r . --filter ../include/consistent_hash --exclude ../tests --exclude ../examples --exclude ../benchmarks --exclude ../fuzz --xml --output coverage.xml
          gcovr -r . --filter ../include/consistent_hash --exclude ../tests --exclude ../examples --exclude ../benchmarks --exclude ../fuzz --html --output coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: |
            build/coverage/coverage.filtered.info
            build/coverage/coverage.xml
            build/coverage/coverage.html

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const coverage = fs.readFileSync('build/coverage/coverage.filtered.info', 'utf8');
            const lines = coverage.split('\n').filter(l => l.startsWith('LF:') || l.startsWith('LH:'));
            let lf = 0, lh = 0;
            for (const line of lines) {
              if (line.startsWith('LF:')) lf += parseInt(line.split(':')[1]);
              if (line.startsWith('LH:')) lh += parseInt(line.split(':')[1]);
            }
            const pct = lf > 0 ? ((lh / lf) * 100).toFixed(2) : '0.00';
            const body = `## Code Coverage Report\n\n**Line Coverage: ${pct}%** (${lh}/${lf} lines)\n\n<details><summary>Full lcov output</summary>\n\n\`\`\`\n${coverage}\n\`\`\`\n\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  sanitize:
    name: Sanitizers (Address/Undefined)
    runs-on: ubuntu-22.04
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-sanitize-${{ hashFiles('**/CMakeLists.txt', '**/*.cpp', '**/*.hpp') }}

      - name: Configure with sanitizers
        run: |
          cmake -S . -B build/sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCONSISTENT_HASH_ENABLE_SANITIZERS=ON \
            -DCONSISTENT_HASH_BUILD_TESTS=ON \
            -DCONSISTENT_HASH_BUILD_BENCHMARKS=OFF \
            -DCONSISTENT_HASH_BUILD_EXAMPLES=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build with sanitizers
        run: cmake --build build/sanitize --parallel 4

      - name: Run tests with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/sanitize --output-on-failure --parallel 4

  clang-tidy:
    name: Static Analysis (clang-tidy)
    runs-on: ubuntu-22.04
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-18

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure with compile commands
        run: |
          cmake -S . -B build/clang-tidy \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCONSISTENT_HASH_BUILD_TESTS=ON \
            -DCONSISTENT_HASH_BUILD_BENCHMARKS=OFF \
            -DCONSISTENT_HASH_BUILD_EXAMPLES=ON

      - name: Run clang-tidy
        run: |
          cd build/clang-tidy
          run-clang-tidy-18.py -p . -header-filter=.*/include/.* -quiet 2>&1 | head -200

  mutation:
    name: Mutation Testing (mull)
    runs-on: ubuntu-22.04
    needs: build-and-test
    if: github.event_name == 'schedule' || github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install mull
        run: |
          curl -fsSL https://raw.githubusercontent.com/mull-project/mull/main/scripts/install.sh | bash -s -- --version 0.14.0
          echo "$HOME/.mull/bin" >> $GITHUB_PATH

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure with mull
        run: |
          cmake -S . -B build/mull \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCONSISTENT_HASH_BUILD_TESTS=ON \
            -DCONSISTENT_HASH_BUILD_BENCHMARKS=OFF \
            -DCONSISTENT_HASH_BUILD_EXAMPLES=OFF \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_CXX_FLAGS="-fexperimental-new-pass-manager -g -O0"

      - name: Build for mull
        run: cmake --build build/mull --parallel 4

      - name: Run mutation testing
        run: |
          cd build/mull
          mull-cxx --test-framework=GoogleTest --workers=4 \
            --ide-reporter-show-killed --ide-reporter-show-survived \
            --reporters=IDE,SQLite \
            --sqlite-output=mull_results.sqlite \
            ./bin/consistent_hash_tests

      - name: Upload mutation results
        uses: actions/upload-artifact@v5
        with:
          name: mull-results
          path: build/mull/mull_results.sqlite
          if-no-files-found: ignore

      - name: Comment mutation score on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const sqlite3 = require('sqlite3').verbose();
            const db = new sqlite3.Database('build/mull/mull_results.sqlite');
            db.all("SELECT COUNT(*) as total, SUM(CASE WHEN status = 'Killed' THEN 1 ELSE 0 END) as killed FROM mutation_results", (err, rows) => {
              if (err) throw err;
              const total = rows[0].total;
              const killed = rows[0].killed;
              const score = total > 0 ? ((killed / total) * 100).toFixed(2) : '0.00';
              const body = `## Mutation Testing Report\n\n**Mutation Score: ${score}%** (${killed}/${total} mutants killed)\n\n<details><summary>Full mull output</summary>\n\n\`\`\`\nTotal mutants: ${total}\nKilled: ${killed}\nSurvived: ${total - killed}\n\`\`\`\n\n</details>`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            });

  fuzz:
    name: Fuzzing (libFuzzer)
    runs-on: ubuntu-22.04
    needs: build-and-test
    if: github.event_name == 'schedule' || github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang-18

      - name: Configure with libFuzzer
        run: |
          cmake -S . -B build/fuzz \
            -DCMAKE_BUILD_TYPE=Release \
            -DCONSISTENT_HASH_BUILD_FUZZERS=ON \
            -DCONSISTENT_HASH_BUILD_TESTS=OFF \
            -DCONSISTENT_HASH_BUILD_BENCHMARKS=OFF \
            -DCONSISTENT_HASH_BUILD_EXAMPLES=OFF \
            -DCMAKE_CXX_COMPILER=clang++-18

      - name: Build fuzzers
        run: cmake --build build/fuzz --parallel 4

      - name: Run fuzzer smoke tests
        run: |
          cd build/fuzz
          for fuzzer in fuzz_*; do
            echo "Running $fuzzer..."
            timeout 60 ./"$fuzzer" -runs=1000 -max_len=100 -timeout=30 || true
          done

      - name: Upload crash corpus
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fuzz-corpus
          path: build/fuzz/*.json
          if-no-files-found: ignore

  chaos:
    name: Chaos Testing
    runs-on: ubuntu-22.04
    needs: build-and-test
    if: github.event_name == 'schedule' || github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure with chaos tests
        run: |
          cmake -S . -B build/chaos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCONSISTENT_HASH_BUILD_TESTS=ON \
            -DCONSISTENT_HASH_BUILD_CHAOS_TESTS=ON \
            -DCONSISTENT_HASH_BUILD_BENCHMARKS=OFF \
            -DCONSISTENT_HASH_BUILD_EXAMPLES=OFF

      - name: Build chaos tests
        run: cmake --build build/chaos --parallel 4

      - name: Run chaos experiments
        run: |
          cd build/chaos
          ctest --test-dir . --output-on-failure --parallel 1 -R Chaos || true

      - name: Upload chaos results
        uses: actions/upload-artifact@v5
        with:
          name: chaos-results
          path: build/chaos/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  benchmark-regression:
    name: Benchmark Regression Detection
    runs-on: ubuntu-22.04
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure benchmarks
        run: |
          cmake -S . -B build/bench \
            -DCMAKE_BUILD_TYPE=Release \
            -DCONSISTENT_HASH_BUILD_BENCHMARKS=ON \
            -DCONSISTENT_HASH_BUILD_TESTS=OFF \
            -DCONSISTENT_HASH_BUILD_EXAMPLES=OFF

      - name: Build benchmarks
        run: cmake --build build/bench --parallel 4

      - name: Run benchmarks
        run: |
          cd build/bench
          ./bin/consistent_hash_benchmarks --benchmark_out=benchmarks.json --benchmark_out_format=json

      - name: Compare with baseline
        run: |
          python3 -c "
import json
import sys

with open('build/bench/benchmarks.json') as f:
    current = json.load(f)

# Load baseline from main branch
import subprocess
subprocess.run(['git', 'fetch', 'origin', 'main'], check=True)
subprocess.run(['git', 'checkout', 'origin/main', '--', 'benchmarks_baseline.json'], check=True)

with open('benchmarks_baseline.json') as f:
    baseline = json.load(f)

regressions = []
for curr in current['benchmarks']:
    base = next((b for b in baseline['benchmarks'] if b['name'] == curr['name']), None)
    if base:
        ratio = curr['real_time'] / base['real_time']
        if ratio > 1.1:  # 10% regression threshold
            regressions.append({
                'name': curr['name'],
                'current': curr['real_time'],
                'baseline': base['real_time'],
                'ratio': ratio
            })

if regressions:
    print('BENCHMARK REGRESSIONS DETECTED:')
    for r in regressions:
        print(f\"  {r['name']}: {r['current']:.2f} vs {r['baseline']:.2f} ({r['ratio']:.2%} slower)\")
    sys.exit(1)
else:
    print('No benchmark regressions detected')
    # Update baseline
    import shutil
    shutil.copy('build/bench/benchmarks.json', 'benchmarks_baseline.json')
"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-results
          path: build/bench/benchmarks.json
          if-no-files-found: ignore

  python-bindings:
    name: Python Bindings
    runs-on: ubuntu-22.04
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pybind11 scikit-build-core pytest pytest-benchmark

      - name: Build Python bindings
        run: |
          cd bindings/python
          pip install -v . --no-build-isolation

      - name: Test Python bindings
        run: |
          cd bindings/python
          python -c "
import consistent_hash
h = consistent_hash.RingHasher()
h.add_node('node1', '10.0.0.1:11211', 100)
h.add_node('node2', '10.0.0.2:11211', 100)
result = h.lookup('test-key')
print(f'Lookup result: {result}')
assert result in ['node1', 'node2']

# Test lock-free
lf = consistent_hash.make_lockfree(consistent_hash.RingHasher())
lf.add_node_atomic('node3', '10.0.0.3:11211', 100)
print(f'Lock-free lookup: {lf.lookup(\"test\")}')
print('Python bindings test passed!')
"

      - name: Upload Python wheel
        uses: actions/upload-artifact@v5
        with:
          name: python-wheel
          path: bindings/python/dist/*.whl
          if-no-files-found: ignore

  go-bindings:
    name: Go Bindings
    runs-on: ubuntu-22.04
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y gcc g++
          cd bindings/go
          go mod tidy

      - name: Build Go bindings
        run: |
          cd bindings/go
          CGO_ENABLED=1 go build ./...

      - name: Test Go bindings
        run: |
          cd bindings/go
          go test -v ./...

  rust-bindings:
    name: Rust Bindings
    runs-on: ubuntu-22.04
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: actions/setup-rust@v1
        with:
          profile: minimal

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Build Rust bindings
        run: |
          cd bindings/rust
          cargo build --release

      - name: Test Rust bindings
        run: |
          cd bindings/rust
          cargo test --release

  cli-tool:
    name: CLI Tool
    runs-on: ubuntu-22.04
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure CLI
        run: |
          cmake -S examples/cli -B build/cli \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build CLI
        run: cmake --build build/cli --parallel 4

      - name: Test CLI
        run: |
          cd build/cli
          ./chash --help
          ./chash --algorithm ring --nodes "node1:10.0.0.1:100,node2:10.0.0.2:100" inspect --stats
          ./chash --algorithm jump --nodes "node1:10.0.0.1:100,node2:10.0.0.2:100" benchmark --duration 2 --threads 2

      - name: Upload CLI binary
        uses: actions/upload-artifact@v5
        with:
          name: cli-tool
          path: build/cli/chash
          if-no-files-found: ignore

  docker-build:
    name: Docker Multi-arch Build
    runs-on: ubuntu-22.04
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: consistent-hash:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image (amd64)
        run: |
          docker run --rm --platform linux/amd64 consistent-hash:${{ github.sha }} \
            ./bin/example_load_balancer
          docker run --rm --platform linux/amd64 consistent-hash:${{ github.sha }} \
            ./bin/example_cache_sharding
          docker run --rm --platform linux/amd64 consistent-hash:${{ github.sha }} \
            ./bin/example_db_sharding
          docker run --rm --platform linux/amd64 consistent-hash:${{ github.sha }} \
            ./bin/example_cdn_routing

  release:
    name: Create Release
    runs-on: ubuntu-22.04
    needs: [build-and-test, sanitize, clang-tidy, docker-build, coverage, fuzz, chaos, mutation, benchmark-regression, codeql]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure release build
        run: cmake --preset release

      - name: Build release
        run: cmake --build build/release --parallel 4

      - name: Run tests
        run: ctest --test-dir build/release --output-on-failure

      - name: Package artifacts
        run: |
          cd build/release
          cpack -G TGZ
          cpack -G ZIP

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: build/release
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v5
        with:
          name: sbom
          path: build/release/sbom.spdx.json

      - name: Sign artifacts with cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'latest'

      - name: Sign release artifacts
        env:
          COSIGN_YES: 'true'
        run: |
          cd build/release
          for file in *.tar.gz *.zip; do
            cosign sign-blob --yes --output-signature "${file}.sig" "${file}"
            cosign sign-blob --yes --output-signature "${file}.sig.pem" --type=sha256 "${file}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/*.tar.gz
            build/release/*.zip
            build/release/*.sig
            build/release/*.sig.pem
            build/release/sbom.spdx.json
          generate_release_notes: true