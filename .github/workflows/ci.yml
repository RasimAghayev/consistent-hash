name: CI

on:
  push:
    branches: [main, test, preview]
  pull_request:
    branches: [test, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CXX_FLAGS: -Wall -Wextra -Wpedantic -Werror

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format
      - run: >
          find include src tests benchmarks examples -name '*.hpp' -o -name '*.cpp'
          | xargs -r clang-format --dry-run --Werror

  build-test-gcc:
    runs-on: ubuntu-latest
    needs: lint-format
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCONSISTENT_HASH_BUILD_TESTS=ON -DCONSISTENT_HASH_BUILD_BENCHMARKS=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  build-test-clang:
    runs-on: ubuntu-latest
    needs: lint-format
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build clang++
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DCONSISTENT_HASH_BUILD_TESTS=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  build-test-msvc:
    runs-on: windows-latest
    needs: lint-format
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCONSISTENT_HASH_BUILD_TESTS=ON -DCONSISTENT_HASH_BUILD_BENCHMARKS=OFF
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    needs: lint-format
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build clang++
      - run: >
          cmake -S . -B build-san
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="${CXX_FLAGS} -fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCONSISTENT_HASH_BUILD_TESTS=ON
          -DCONSISTENT_HASH_BUILD_BENCHMARKS=OFF
      - run: cmake --build build-san --parallel
      - run: ctest --test-dir build-san --output-on-failure

  benchmarks:
    runs-on: ubuntu-latest
    needs: lint-format
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCONSISTENT_HASH_BUILD_TESTS=OFF -DCONSISTENT_HASH_BUILD_BENCHMARKS=ON
      - run: cmake --build build --parallel --target consistent_hash_benchmarks
      - run: ./build/benchmarks/consistent_hash_benchmarks

  docker-build-test:
    runs-on: ubuntu-latest
    needs: [build-test-gcc, build-test-clang]
    if: github.ref == 'refs/heads/test' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - run: docker build -t consistent-hash --target tester .
