name: Bug Report
description: Report a bug in the library
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: Version/Commit
      description: Which version or commit hash are you using?
      placeholder: "v1.0.0 or a1b2c3d"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux (specify distro)
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: compiler
    attributes:
      label: Compiler
      description: Which compiler and version?
      placeholder: "GCC 13.2, Clang 18, MSVC 19.38"
    validations:
      required: true
  - type: input
    id: cmake
    attributes:
      label: CMake Version
      placeholder: "3.25.1"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code example that reproduces the issue
      render: cpp
      placeholder: |
        #include "consistent_hash/ring.hpp"
        
        int main() {
          consistent_hash::RingHasher<> hasher;
          // ... code that triggers the bug
        }
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens? (error messages, crashes, wrong results)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs/Output
      description: Compiler output, test failures, sanitizer reports, etc.
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I have tested with the latest main branch
          required: true
        - label: I can provide a minimal reproduction case
          required: true