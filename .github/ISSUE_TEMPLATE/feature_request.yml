name: Feature Request
description: Suggest a new feature or enhancement
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please fill out the details below.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What use case does it address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you'd like. Include API design, algorithm choice, or configuration options.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider? Why is this the best option?
    validations:
      required: false
  - type: textarea
    id: api
    attributes:
      label: API Design (if applicable)
      description: Show example usage of the proposed API
      render: cpp
      placeholder: |
        // Example usage
        consistent_hash::NewAlgorithmHasher<> hasher;
        hasher.add_node(...);
        auto result = hasher.lookup(key);
    validations:
      required: false
  - type: dropdown
    id: impact
    attributes:
      label: Impact Assessment
      options:
        - Low (internal only, no API changes)
        - Medium (new API, backward compatible)
        - High (breaking changes, migration needed)
    validations:
      required: true
  - type: textarea
    id: performance
    attributes:
      label: Performance Considerations
      description: Expected impact on lookup speed, memory usage, build time
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues/PRs for similar requests
          required: true
        - label: This feature aligns with the project's scope (consistent hashing algorithms)
          required: true
        - label: I am willing to implement this feature (or help with implementation)
          required: false